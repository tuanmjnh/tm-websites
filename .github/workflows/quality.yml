name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: All gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TM_MONGO_URI: mongodb://127.0.0.1:27017
      TM_MONGO_DB: tm-ci-gates
      TM_SITE_ID: sentuan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One step on purpose: the same command that runs locally, so a gate cannot be added in
      # package.json and quietly left out of CI (which is how verify:scaffold stayed red).
      - name: Run every gate
        run: pnpm verify:all

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-log
          path: .devlogs/gates.log
          if-no-files-found: ignore
