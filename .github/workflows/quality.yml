name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: All gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # The job-local MongoDB service is physically isolated from any developer's
    # MongoDB. It uses the same logical database name as local development, so the
    # registry binding and the gate command need no CI-only code path
    # (docs/v2/15-local-development-and-test-policy.md §4).
    env:
      TM_MONGO_URI: mongodb://127.0.0.1:27017
      TM_MONGO_DB: sen-tuan
      TM_SITE_ID: sentuan
      TM_CUSTOMER_ID: sentuan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Preflight: prove the service is reachable and the selected database is
      # exactly the registry name. Prints the logical name only, never the URI.
      - name: Preflight database binding
        run: |
          node --input-type=module -e "
            import net from 'node:net'
            const name = process.env.TM_MONGO_DB
            if (name !== 'sen-tuan') { console.error('expected sen-tuan, got ' + name); process.exit(1) }
            console.log('database: ' + name)
            const socket = net.connect(27017, '127.0.0.1')
            socket.setTimeout(5000, () => { console.error('mongodb service timeout'); process.exit(1) })
            socket.on('connect', () => { console.log('mongodb service reachable'); socket.end() })
            socket.on('error', (error) => { console.error(error.message); process.exit(1) })
          "

      # One step on purpose: the same command that runs locally, so a gate cannot be added in
      # package.json and quietly left out of CI (which is how verify:scaffold stayed red).
      - name: Run every gate
        run: pnpm verify:all

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-log
          path: .devlogs/gates.log
          if-no-files-found: ignore

  # `verify:all` never builds: `validate:build:cms` and `validate:build:web` are opt-in gates that
  # need a production build, so a Nuxt/Nitro build break used to merge green. This job runs both
  # halves for both apps, which is what an operator does before a deploy.
  builds:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TM_CUSTOMER_ID: sentuan
      TM_SITE_ID: sentuan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CMS and validate its output
        run: |
          pnpm build:cms
          pnpm validate:build:cms

      - name: Build the storefront and validate its output
        run: |
          pnpm build:web
          pnpm validate:build:web
